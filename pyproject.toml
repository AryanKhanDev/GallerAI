[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "gallerai"
version     = "0.1.0"
description = "Offline multimodal retrieval and conversational gallery system"
requires-python = ">=3.10"

dependencies = [
    # Core AI
    "open-clip-torch>=2.24.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    # Storage
    "lancedb>=0.6.0",
    "pyarrow>=14.0.0",
    # OCR
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.3",
    # Image handling
    "Pillow>=10.1.0",
    # Data / schemas
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]          # lowercase only — fixes FIX #1 at test discovery level